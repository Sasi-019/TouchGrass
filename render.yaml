# Render Blueprint: creates the API and a PostgreSQL database together.
# Secrets are NOT stored here. Render asks you for the "sync: false" values
# in its dashboard the first time you deploy.
databases:
  - name: touchgrass-db
    plan: free
    databaseName: touchgrass

services:
  - type: web
    name: touchgrass-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: touchgrass-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
